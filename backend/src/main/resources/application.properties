spring.application.name=core
server.port=8000

# Perfil por defecto para desarrollo local
spring.profiles.default=dev

# H2 config (desarrollo)
spring.datasource.url=jdbc:h2:mem:growthhub
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.path=/h2-console

# JPA / Hibernate
# Nota: el MVP no usa Flyway. El esquema de referencia es
# backend/db/base-de-datos-mvp.sql; en desarrollo Hibernate genera el esquema.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging
logging.level.root=INFO
logging.level.com.growthhub=INFO